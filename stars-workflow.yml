name: Update Stars

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# 推分支需要写权限。action 不能自行提权，必须在这里给。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: maxzhang666/OpsStar@main
        with:
          actor: maxzhang666
          title: Stars
          desc: 我 star 过的 GitHub 仓库
          lang: zh-CN
          branch: gh-pages