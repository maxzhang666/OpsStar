name: Sync stars

# ============================================================================
# 三种触发方式：
#   1. schedule       —— 本仓库自己每天自动更新
#   2. workflow_dispatch —— 本仓库手动触发（Actions 页面点按钮）
#   3. workflow_call  —— ⭐ 别人在自己的仓库里直接调用，无需 fork
#
# 第3 种用法（别人在自己仓库的 .github/workflows/stars.yml 里写）：
#
#   name: My Stars
#   on:
#     schedule: [{ cron: '17 3 * * *' }]
#     workflow_dispatch:
#   jobs:
#     build:
#       uses: maxzhang666/OpsStar/.github/workflows/sync.yml@main
#       with:
#         actor: <你的 GitHub 用户名>
#         title: My Star Shelf
#       secrets:
#         star_token: ${{ secrets.STAR_TOKEN }}   # 可选，star > 6000 才需要
#
# ⭐ 关键：被调用时 actions/checkout 拉的是**调用方**的仓库（可能根本没有 scripts/），
#    所以必须显式 checkout 本仓库来取脚本。用官方 codeload tarball，
#    这样 workflow 文件本身不必存在于调用方仓库。
# ============================================================================
on:
  schedule:
    # 每天 03:17 UTC（约北京时间 11:17）。刻意避开整点，减少和别人的任务撞车导致的延迟。
    - cron: '17 3 * * *'

  workflow_dispatch:
    inputs:
      actor:
        description: '抓谁的 star（留空 = 本仓库所有者）'
        required: false
        type: string
      limit:
        description: '最多抓取多少个 star（留空 = 全部）'
        required: false
        type: string
      enrich:
        description: '为前 N 个仓库额外抓语言分布（0 = 不抓）'
        required: false
        type: string
        default: '0'

  workflow_call:
    inputs:
      actor:
        description: '抓谁的 star（留空 = 调用方仓库所有者）'
        required: false
        type: string
      limit:
        description: '最多抓取多少个 star（留空 = 全部）'
        required: false
        type: string
      enrich:
        description: '为前 N 个仓库额外抓语言分布（0 = 不抓）'
        required: false
        type: string
      title:
        description: '站点标题（留空用默认值）'
        required: false
        type: string
      desc:
        description: '站点副标题（留空用默认值）'
        required: false
        type: string
      lang:
        description: '界面默认语言'
        required: false
        type: string
    secrets:
      star_token:
        description: '可选 PAT（仅 public_repo 权限）。star 超过 6000 个时才需要。'
        required: false

# 推 gh-pages 需要写权限。注意：workflow_call 时这个上限由**调用方**决定，
# 若调用方没给 permissions，这里也拿不到写权限（GitHub 不允许被调用方提权）。
permissions:
  contents: write

# 同一时间只跑一个，避免手动触发和定时任务互相覆盖。
# 带上调用方仓库名，防止不同用户共用同一 group 互相排队。
concurrency:
  group: sync-stars-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出构建脚本
        env:
          # ⭐ workflow_call 时 github.* 上下文全部指向**调用方**：
          #    github.repository 是调用方的仓库，github.sha 是调用方的 commit。
          #    所以脚本必须从 OpsStar 本仓库取，不能用 github.* 拼路径。
          #
          # 本仓库是公开的，codeload 可匿名下载，无需任何 token（也就绕开了
          # 「被调用时 GITHUB_TOKEN 只有调用方权限、读不到本仓库」的问题）。
          OPSSTAR_REPO: maxzhang666/OpsStar
          OPSSTAR_REF: ${{ vars.OPSSTAR_REF || 'main' }}
        run: |
          # 允许用仓库变量 OPSSTAR_REF 覆盖版本（如固定到 tag，保证调用方不受主干变动影响）
          for REF in "$OPSSTAR_REF" main master; do
            URL="https://codeload.github.com/${OPSSTAR_REPO}/tar.gz/${REF}"
            if curl -fsSL "$URL" -o repo.tar.gz 2>/dev/null; then
              mkdir -p repo && tar -xzf repo.tar.gz -C repo --strip-components=1
              if [ -f repo/scripts/fetch_stars.py ]; then
                echo "✅ 已取得 ${OPSSTAR_REPO}@${REF} 的 scripts/"
                exit 0
              fi
            fi
            echo "… ${REF} 取不到，尝试下一个"
          done
          echo "❌ 未能从 ${OPSSTAR_REPO} 取得 scripts/fetch_stars.py"
          echo "   若这是新仓库，请先把它推到 GitHub；也可用变量 OPSSTAR_REF 指定分支/tag。"
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取 star
        env:
          # ⭐ 不要用内置 secrets.GITHUB_TOKEN 抓 star：
          # 它是 GitHub App 的 installation token，调 /user/starred 会返回 403
          # （integration 无权访问用户级接口）。
          #
          # 默认走匿名 + --actor，公开 star 完全够用，也不用配任何 secret。
          # 只有 star 超过 6000 个（匿名每小时约 6000 次请求）才需要 PAT。
          GH_TOKEN: ${{ secrets.star_token }}
          # actor 优先级：显式传入 > 调用方/本仓库所有者
          IN_ACTOR: ${{ inputs.actor }}
          FALLBACK_ACTOR: ${{ github.repository_owner }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_ENRICH: ${{ inputs.enrich }}
        run: |
          ACTOR="${IN_ACTOR:-$FALLBACK_ACTOR}"
          echo "抓取 @$ACTOR 的 star"

          # 用 shell 拼参数而不是在 YAML 里插值：inputs 在 schedule 触发时不存在，
          # 直接写 format('--limit {0}', inputs.limit) 会求值异常。
          ARGS=(--out data/stars.json --actor "$ACTOR")
          [ -n "$IN_LIMIT" ] && ARGS+=(--limit "$IN_LIMIT")
          case "${IN_ENRICH:-}" in ''|*[!0-9]*) ;; *) ARGS+=(--enrich "$IN_ENRICH") ;; esac

          python repo/scripts/fetch_stars.py "${ARGS[@]}"

      - name: 构建静态站
        env:
          IN_TITLE: ${{ inputs.title }}
          IN_DESC: ${{ inputs.desc }}
          IN_LANG: ${{ inputs.lang }}
        run: |
          ARGS=(--data data/stars.json --out dist)
          [ -n "$IN_TITLE" ] && ARGS+=(--title "$IN_TITLE")
          [ -n "$IN_DESC" ]  && ARGS+=(--desc "$IN_DESC")
          [ -n "$IN_LANG" ]  && ARGS+=(--lang "$IN_LANG")
          python repo/scripts/build_site.py "${ARGS[@]}"

      - name: 推送到 gh-pages
        env:
          # 推分支要用调用方仓库的 token。
          # 被调用时 secrets.GITHUB_TOKEN 仍是「本仓库」（即 OpsStar）的凭据，
          # 但 push 的目标是 github.repository —— workflow_call 下这是**调用方**的仓库，
          # 正好是我们想要的：站点发布到使用者的仓库上。
          GH_PAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          # 在 dist/ 里单独 init 一个仓库推，不动主 checkout。
          # 相比 `git checkout --orphan`：不会把源码目录带进 gh-pages，
          # 而且天然是「每次只有一个提交」的历史形态。
          cd dist
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: update stars ($(TZ=UTC date +%Y-%m-%d))"
          git push -f \
            "https://x-access-token:${GH_PAGES_TOKEN}@github.com/${TARGET_REPO}.git" \
            HEAD:gh-pages
          echo "✅ 已推送 ${TARGET_REPO} 的 gh-pages 分支"

      - name: 上传构建产物（便于排查）
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          retention-days: 7